syntax = "proto3";

package gamepb.interactpb;

message InteractRecord {
    int64 server_time = 1;
    int32 action_type = 2;
    int64 visitor_gid = 3;
    string nick = 4;
    string avatar_url = 5;
    int32 crop_id = 6;
    int32 crop_count = 7;
    int32 times = 8;
    int32 from_type = 9;
    int32 level = 10;

    message Extra {
        int32 land_id = 1;
        int32 flag1 = 2;
        int32 flag2 = 3;
    }

    Extra extra = 11;
    // [fnos-fork] 牧场访客记录（InteractRecordsRequest scene_id=2）多出的字段，按 1116-6 #302 / 1116-7 #230 回包补：
    // 22 = 被互动的动物 id（type 11 时出现，如 60002 鸭）；19 含义未确认（9~24 的小整数，原样保留）。
    // 牧场回包里的 11 是访客的铭牌/头像框列表（401xxx / 21xx），与农场 Extra 同号，按 Extra 解码时多余字段被忽略。
    int32 fnos_field19 = 19;
    int64 fnos_animal_id = 22;
}

// [fnos-fork] 1 = 场景：不带（0）为农场（上游原样），2 = 牧场（抓包 1116-3 #229 / 1116-6 #301 / 1116-7 #229）
message InteractRecordsRequest {
    int32 scene_id = 1;
}

message InteractRecordsReply {
    repeated InteractRecord records = 1;
}

// --- 获取互动信息 ---
message InteractInfo {
    int64 visitor_gid = 1;
    string nick = 2;
    string avatar_url = 3;
    int32 action_type = 4;
    int64 server_time = 5;
    int32 crop_id = 6;
    int32 crop_count = 7;
    int32 level = 8;
}

message GetInteractInfoRequest {}

message GetInteractInfoReply {
    repeated InteractInfo infos = 1;
    int64 server_time = 2;
}

// --- 获取互动摘要 ---
message InteractSummary {
    int64 total_water = 1;
    int64 total_insecticide = 2;
    int64 total_weed = 3;
    int64 total_steal = 4;
    int64 total_stolen = 5;
    int64 visitor_count = 6;
}

message GetInteractSummaryRequest {}

message GetInteractSummaryReply {
    InteractSummary summary = 1;
}

// --- 关闭互动弹窗 ---
message DismissInteractPopupRequest {}

message DismissInteractPopupReply {}
